<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Create Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <div class="logo">
            BlogSpace
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

    </header>


    <!-- =========================
         CREATE BLOG
    ========================== -->

    <main class="form-page">

        <div class="form-card blog-form-card">

            <h1>Create a Blog</h1>

            <p class="form-subtitle">
                Share your thoughts and ideas with the world
            </p>


            <form id="blogForm">

                <!-- BLOG TITLE -->

                <label for="blogTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="blogTitle"
                    name="title"
                    placeholder="Enter your blog title"
                    required
                >


                <!-- CATEGORY -->

                <label for="blogCategory">
                    Category
                </label>

                <select
                    id="blogCategory"
                    name="category"
                    required
                >

                    <option value="">
                        Select a category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Lifestyle">
                        Lifestyle
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- AUTHOR -->

                <label for="blogAuthor">
                    Author Name
                </label>

                <input
                    type="text"
                    id="blogAuthor"
                    name="author"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >


                <!-- BLOG CONTENT -->

                <label for="blogContent">
                    Blog Content
                </label>

                <textarea
                    id="blogContent"
                    name="content"
                    rows="8"
                    placeholder="Write your blog content here..."
                    required
                ></textarea>


                <!-- STATUS -->

                <label for="blogStatus">
                    Status
                </label>

                <select
                    id="blogStatus"
                    name="status"
                    required
                >

                    <option value="Published">
                        Published
                    </option>

                    <option value="Draft">
                        Draft
                    </option>

                </select>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="form-btn"
                >
                    Publish Blog
                </button>

            </form>


            <!-- BACK LINK -->

            <p class="form-bottom">

                <a href="dashboard.html">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 BlogSpace. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
